[package]
name = "youtube_downloader_rs"
version = "2.0.0"
edition = "2024"

[[bin]]
name = "YouTubeMP3Downloader"
path = "src/main.rs"

[dependencies]
arboard = "3.7.0"
dirs = "7.0.0"
eframe = { version = "0.29", default-features = true }
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
rfd = "0.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.5", default-features = true }

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
